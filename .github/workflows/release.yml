name: Release portable packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            extra: --deb
          - os: windows-latest
            platform: windows-x64
            extra: ''
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Verify tag matches source version
        shell: bash
        run: |
          uv run --locked python -c "import os, tomllib; from ramtaskman import __version__; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + v and v == __version__"
      - run: uv sync --locked --group release
      - name: Build and verify extracted native bundle
        run: uv run --locked --group release python tools/build_release.py ${{ matrix.extra }}
      - name: Install and verify Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/release/ramtaskman_*_amd64.deb
          uv run --locked python -c "from pathlib import Path; from tools.build_release import smoke; from ramtaskman import __version__; smoke(Path('/usr/bin/ramtaskman'), __version__)"
          dpkg-query -W ramtaskman
          sudo apt-get remove -y ramtaskman
      - name: Build source distributions
        if: runner.os == 'Linux'
        run: uv build
      - name: Include source distributions and checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp dist/*.whl dist/*.tar.gz dist/release/
          cd dist/release
          sha256sum *.whl *.tar.gz > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ramtaskman-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified release
    needs: [checks, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ramtaskman-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --title "ramtaskman $GITHUB_REF_NAME — first portable release" \
            --notes-file packaging/RELEASE_NOTES.md
