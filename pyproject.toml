[project]
name = "ramtaskman"
version = "0.1.0"
description = "Cross-platform RAM task manager: application memory, PSS, USS and swap, with the gputaskman terminal UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=7.2.2,<8", "textual>=8.2.8,<9"]

[project.scripts]
ramtaskman = "ramtaskman.cli:main"
rtm = "ramtaskman.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.14.0"]
build-backend = "uv_build"
